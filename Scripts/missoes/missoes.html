<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="missoes.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Obsidian</title>
</head>
<body>
    <main id="tela">
        <div id="seta_direita" class="seta" onclick="cenaDireita()"></div>
        <div id="seta_esquerda" class="seta" onclick="cenaEsquerda()"></div>
        <div id="missao1" class="missoes">
            <div id="cena1_missao1" class="cena">
                <div id="porta1" class="porta" onclick="abrirPortaMissao1()"></div>
            </div>

            <div id="cena2_missao1" class="cena">
                <div id="vasoDeFlor" class="vasoDeFlor"></div>
                <div id="vasoDeFlorClicavel" class="vasoDeFlor" onclick="mostrarPapelCodigo()"></div>
                <div id="codigo1" class="codigo" onclick="esconderPapel()">
                    
                </div>
            </div>

            <div id="cena3_missao1" class="cena">
                <div id="bau1Fechado" class="bau" onclick="abrirBauMissao1()"></div>
                <div id="bau1Aberto" class="bau"></div>

                <div id="fechadura1" class="fechaduraDigital">
                    <input
                        type="text"
                        id="visor"
                        maxlength="4"
                        inputmode="numeric"
                        placeholder="----"
                        autocomplete="off"
                    >
                    <button id="okMissao1" onclick="confirmarCodigoMissao1()">OK</button>
                </div>
            </div>
        </div>
        <div id="missao2" class="missoes">
            <div id="cena1_missao2" class="cena">

            </div>

            <div id="cena2_missao2" class="cena">

            </div>

            <div id="cena3_missao2" class="cena">

            </div>
        </div>
        <div id="missao3" class="missoes">
            <div id="cena1_missao3" class="cena">

            </div>

            <div id="cena2_missao3" class="cena">

            </div>

            <div id="cena3_missao3" class="cena">

            </div>
        </div>
    </main>

    <script src="missoes.js"></script>
</body>
</html>
